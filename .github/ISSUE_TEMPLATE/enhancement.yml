name: "Enhancement"
description: Define a concrete, implementable Strata feature or capability update.
title: "[Enhancement] "
labels: ["enhancement", "type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Overview
        A clear description of what existing feature or area is being improved and why.

  - type: textarea
    id: current
    attributes:
      label: "Current Behavior"
      placeholder: |
        How does this work today? Describe the current state.

  - type: textarea
    id: improved
    attributes:
      label: "Improved Behavior"
      placeholder: |
        What should it do or how should it work after the change?

  - type: textarea
    id: rationale
    attributes:
      label: "Rationale"
      placeholder: |
        Why is this improvement worth the effort? Who benefits?

  - type: textarea
    id: scope
    attributes:
      label: "Scope & Boundaries"
      placeholder: |
        What is in scope? What is explicitly out of scope?

  - type: checkboxes
    id: priority
    attributes:
      label: "Priority"
      options:
        - label: "Critical — blocks current functionality"
        - label: "High — significant UX improvement"
        - label: "Medium — worthwhile quality of life fix"
        - label: "Low — polish and refinement"

  - type: textarea
    id: delivery
    attributes:
      label: "Implementation and Acceptance Criteria"
      description: "Define the working capability to deliver. A blueprint or plan alone is not completion."
      placeholder: |
        Actor and prerequisites:
        Exact actions and expected results:
        Data/API/permission rules and failure recovery:
        Dependencies and genuine blockers:
        Regression coverage and PM testing steps:
    validations:
      required: true
