name: "Feature Request"
description: Define a concrete, implementable Strata feature or capability update.
title: "[Feature] "
labels: ["enhancement", "type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## Overview
        A brief summary of the proposed feature and why it would be useful.

  - type: textarea
    id: problem
    attributes:
      label: "Problem It Solves"
      placeholder: |
        What specific problem does this solve? Who benefits and how?

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      placeholder: |
        Describe what you're proposing. Be as specific as possible.

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      placeholder: |
        Any other approaches you considered? Why not those?

  - type: checkboxes
    id: priority
    attributes:
      label: "Priority"
      options:
        - label: "Critical — blocks daily use"
        - label: "High — important workflow enhancement"
        - label: "Medium — nice to have"
        - label: "Low — future consideration"

  - type: checkboxes
    id: checklists
    attributes:
      label: "Checklist"
      options:
        - label: "I have searched for existing feature requests"
          required: true

  - type: textarea
    id: delivery
    attributes:
      label: "Implementation and Acceptance Criteria"
      description: "Define the working capability to deliver. A blueprint or plan alone is not completion."
      placeholder: |
        Actor and prerequisites:
        Exact actions and expected results:
        Data/API/permission rules and failure recovery:
        Dependencies and genuine blockers:
        Regression coverage and PM testing steps:
    validations:
      required: true
