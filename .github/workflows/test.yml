name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Ubuntu runner already includes Chromium's shared libraries.
      # Install the lockfile-selected browser without fetching extra system fonts.
      - run: npx playwright install chromium
      - run: npm run check
